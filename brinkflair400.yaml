select:
  - id: brink_bypass_mode
    name: Bypass Mode
    platform: modbus_controller
    modbus_controller_id: ${name}  
    address: 6100
    value_type: S_WORD
    skip_updates: 10
    optionsmap:
      ${auto}: 0
      ${closed}: 1
      ${open}: 2
  - platform: template
    id: brink_betriebsmodus
    name: "Brink Betriebsmodus"
    icon: mdi:fan-auto
    options:
      - "Automatik"
      - "Urlaub"
      - "Niedrig"
      - "Normal"
      - "Hoch"
    update_interval: 2s
    lambda: |-
      if (isnan(id(brink_readback_7990).state) ||
          isnan(id(brink_readback_8000).state) ||
          isnan(id(brink_readback_8001).state) ||
          isnan(id(brink_readback_8003).state)) {
        return {};
      }

      const int interface_mode = static_cast<int>(id(brink_readback_7990).state);
      const int control_mode = static_cast<int>(id(brink_readback_8000).state);
      const int preset = static_cast<int>(id(brink_readback_8001).state);
      const int standby = static_cast<int>(id(brink_readback_8003).state);

      if (interface_mode == 1 && control_mode == 0 &&
          preset == 1 && standby == 0) {
        return std::string("Automatik");
      }

      if (interface_mode == 2 && control_mode == 1 && standby == 0) {
        switch (preset) {
          case 0: return std::string("Urlaub");
          case 1: return std::string("Niedrig");
          case 2: return std::string("Normal");
          case 3: return std::string("Hoch");
          default: break;
        }
      }

      // Do not invent a state when the four registers form an unknown
      // combination. The last valid UI state remains visible until the
      // readbacks become consistent.
      return {};
    set_action:
      - lambda: |-
          int preset = 0;
          const bool automatic = (x == "Automatik");

          if (x == "Urlaub") {
            preset = 0;
          } else if (x == "Niedrig") {
            preset = 1;
          } else if (x == "Normal") {
            preset = 2;
          } else if (x == "Hoch") {
            preset = 3;
          }

          auto *controller = id(${name});
          auto write_register = [controller](uint16_t address, uint16_t value) {
            ESP_LOGI("brink.control", "FC06: Register %u = %u", address, value);
            auto command =
                esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
                    controller, address, value);
            controller->queue_command(command);
          };

          id(brink_command_target) = x;
          id(brink_command_started) = millis();
          id(brink_command_pending) = true;
          id(brink_letzte_aktion).publish_state("Sende: " + x);
          ESP_LOGI("brink.control", "Bewusste Auswahl: %s", x.c_str());

          if (automatic) {
            // Tested automatic/time-program sequence, exact order:
            // 7990=1, 8001=1, 8003=0, 8000=0
            id(brink_expected_7990) = 1;
            id(brink_expected_8001) = 1;
            id(brink_expected_8003) = 0;
            id(brink_expected_8000) = 0;

            write_register(7990, 1);
            write_register(8001, 1);
            write_register(8003, 0);
            write_register(8000, 0);
          } else {
            // Tested manual sequence, exact order:
            // 7990=2, 8000=1, 8001=preset, 8003=0
            id(brink_expected_7990) = 2;
            id(brink_expected_8000) = 1;
            id(brink_expected_8001) = preset;
            id(brink_expected_8003) = 0;

            write_register(7990, 2);
            write_register(8000, 1);
            write_register(8001, preset);
            write_register(8003, 0);
          }

switch:
  - id: brink_bypass_boost
    name: Bypass Boost
    platform: modbus_controller
    modbus_controller_id: ${name}
    register_type: holding
    address: 6104
    bitmask: 1
    entity_category: config
    icon: mdi:toggle-switch

button:
  - id: brink_reset_filter_button
    name: Filter reset
    platform: template
    disabled_by_default: true
    on_press:
      then:
        - lambda: |-
            auto command =
                esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
                    id(${name}), 8010, 1);
            id(${name})->queue_command(command);
        - delay: 2s
        - lambda: |-
            auto command =
                esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
                    id(${name}), 8010, 0);
            id(${name})->queue_command(command);
        - text_sensor.template.publish:
            id: brink_filter_reset_on
            state: !lambda |-
              char str[22];
              time_t currTime = id(brink_sntp_time).now().timestamp;
              strftime(str, sizeof(str), "%a %d %b %H:%M", localtime(&currTime));
              return  { str };
  - platform: restart
    id: restart_button
    name: Restart
    
# Enable/Disable logging

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status led
    icon: mdi:lightbulb
    internal: true # Hides from Home Assistant
    rgb_order: GRB
    pin: 35
    num_leds: 4
    chipset: ws2812
#    rmt_channel: 0 #only on platform: arduino
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic
    effects:
      - pulse:
          name: slow_pulse
          transition_length: 250ms
          update_interval: 500ms
          min_brightness: 10%
          max_brightness: 50%
      - pulse:
          name: fast_pulse
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 25%
          max_brightness: 100%

# 🟢 Green on => wifi connected- api connected/ Green blinking => wifi connected - api disconnected
# 🟣 Purple => wifi disconnected
# 🔵 Blue => AP mode

interval:
  - interval: 10s
    then:
      if:
        condition:
          wifi.connected:
        then:
          if:
            condition:
              api.connected:
            then:
              - light.turn_on:
                  id: status_led
                  brightness: 50%
                  red: 0
                  green: 100%
                  blue: 0
                  effect: None
            else:
              - light.turn_on:
                  id: status_led
                  brightness: 50%
                  red: 0
                  green: 100%
                  blue: 0
                  effect: slow_pulse              
        else:
          if:
            condition:
              - lambda: 'return id(id_captive_portal).is_active();'
            then:
              - light.turn_on:
                  id: status_led
                  brightness: 100%
                  red: 0
                  green: 0
                  blue: 100%
            else:
              - light.turn_on:
                  id: status_led
                  brightness: 100%
                  red: 100%
                  green: 0
                  blue: 0
  - interval: 1s
    then:
      - lambda: |-
          if (!id(brink_command_pending)) {
            return;
          }

          const bool readbacks_available =
              !isnan(id(brink_readback_7990).state) &&
              !isnan(id(brink_readback_8000).state) &&
              !isnan(id(brink_readback_8001).state) &&
              !isnan(id(brink_readback_8003).state);

          if (readbacks_available) {
            const bool matches =
                static_cast<int>(id(brink_readback_7990).state) == id(brink_expected_7990) &&
                static_cast<int>(id(brink_readback_8000).state) == id(brink_expected_8000) &&
                static_cast<int>(id(brink_readback_8001).state) == id(brink_expected_8001) &&
                static_cast<int>(id(brink_readback_8003).state) == id(brink_expected_8003);

            if (matches) {
              const std::string message = "Erfolgreich: " + id(brink_command_target);
              id(brink_letzte_aktion).publish_state(message);
              ESP_LOGI("brink.control", "%s", message.c_str());
              id(brink_command_pending) = false;
              return;
            }
          }

          if (millis() - id(brink_command_started) > 75000) {
            char message[180];
            snprintf(
                message, sizeof(message),
                "Keine Bestätigung: %s (7990=%.0f, 8000=%.0f, 8001=%.0f, 8003=%.0f)",
                id(brink_command_target).c_str(),
                id(brink_readback_7990).state,
                id(brink_readback_8000).state,
                id(brink_readback_8001).state,
                id(brink_readback_8003).state);
            id(brink_letzte_aktion).publish_state(message);
            ESP_LOGW("brink.control", "%s", message);
            id(brink_command_pending) = false;
          }
