  brink_dewpoint_to_inside: Zuluft Taupunkt
  brink_external_humidity_sensor: Luftfeuchtigkeitssensor (extern)
  brink_external_co2_sensor1: CO2 Sensor1
  brink_external_co2_sensor2: CO2 Sensor2
  brink_external_co2_sensor3: CO2 Sensor3
  brink_external_co2_sensor4: CO2 Sensor4
  brink_temp_to_outside: Fortluft Temperatur
  brink_humidity_to_outside: Fortluft Luftfeuchtigkeit
