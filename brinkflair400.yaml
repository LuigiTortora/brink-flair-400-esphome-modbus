#
# Brink Flair 400 Standard UWA2-B

# M5Stack AtomS3 Lite + Atomic RS485 Base

#

# Standalone version derived from fonske/Brink-flair-modbus.

# No Modbus write is executed at boot or connection time.

# Operating-mode writes occur only after an explicit user selection.



substitutions:
  name: brinkflair400
  friendly_name: "Brink Flair 400"
  device_description: "Brink Flair 400 Standard UWA2-B via Modbus RTU"
  timezone: "Europe/Berlin"
