text_sensor:
  - platform: template
    name: "Brink Seriennummer"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (isnan(id(brink_serial_part1).state) || isnan(id(brink_serial_part2).state) || isnan(id(brink_serial_part3).state)) return {"unbekannt"};
      char buffer[13];
      sprintf(buffer, "%04d%04d%04d", (int) id(brink_serial_part1).state, (int) id(brink_serial_part2).state, (int) id(brink_serial_part3).state);
      return {buffer};

  - platform: template
    name: "Brink Aktive Funktion"
    update_interval: 10s
    lambda: |-
      if (isnan(id(brink_active_function_code).state)) return {"unbekannt"};
      int v = (int) id(brink_active_function_code).state;
      switch (v) { case 0: return {"Standby"}; case 1: return {"Bootloader"}; case 2: return {"Nicht blockierender Fehler"}; case 3: return {"Blockierender Fehler"}; case 4: return {"Manuell"}; case 5: return {"Urlaub"}; case 6: return {"Nachtlüftung"}; case 7: return {"Party"}; case 8: return {"Bypass Boost"}; case 9: return {"Normal Boost"}; case 10: return {"Auto CO₂"}; case 11: return {"Auto eBus"}; case 12: return {"Auto Modbus"}; case 13: return {"Auto LAN/WLAN Portal"}; case 14: return {"Auto LAN/WLAN Lokal"}; default: return {"Code " + to_string(v)}; }

  - platform: template
    name: "Brink Lüfterregelung"
    update_interval: 10s
    lambda: |-
      if (isnan(id(brink_fan_control_type_code).state)) return {"unbekannt"};
      int v = (int) id(brink_fan_control_type_code).state;
      switch (v) { case 0: return {"Initialisierung"}; case 1: return {"Konstanter Volumenstrom"}; case 2: return {"Konstante PWM"}; case 3: return {"Aus"}; case 4: return {"Fehler"}; case 5: return {"Massenbilanz"}; case 6: return {"Standby"}; default: return {"Code " + to_string(v)}; }

  - platform: template
    name: "Brink Lüftungsmodus"
    update_interval: 10s
    lambda: |-
      if (isnan(id(brink_ventilation_mode_code).state)) return {"unbekannt"};
      int v = (int) id(brink_ventilation_mode_code).state;
      switch (v) { case 0: return {"Urlaub"}; case 1: return {"Niedrig"}; case 2: return {"Normal"}; case 3: return {"Hoch"}; case 4: return {"Automatik"}; default: return {"Code " + to_string(v)}; }

  - platform: template
    name: "Brink Zuluftventilator Status"
    update_interval: 10s
    lambda: |-
      if (isnan(id(brink_supply_fan_status_code).state)) return {"unbekannt"};
      int v = (int) id(brink_supply_fan_status_code).state;
      switch (v) { case 2: return {"Keine Kommunikation"}; case 3: return {"Leerlauf"}; case 4: return {"Läuft"}; case 5: return {"Blockiert"}; case 6: return {"Ventilatorfehler"}; default: return {"Code " + to_string(v)}; }

  - platform: template
    name: "Brink Abluftventilator Status"
    update_interval: 10s
    lambda: |-
      if (isnan(id(brink_exhaust_fan_status_code).state)) return {"unbekannt"};
      int v = (int) id(brink_exhaust_fan_status_code).state;
      switch (v) { case 2: return {"Keine Kommunikation"}; case 3: return {"Leerlauf"}; case 4: return {"Läuft"}; case 5: return {"Blockiert"}; case 6: return {"Ventilatorfehler"}; default: return {"Code " + to_string(v)}; }

  - platform: template
    name: "Brink Bypass Status"
    update_interval: 10s
    lambda: |-
      if (isnan(id(brink_bypass_status_code).state)) return {"unbekannt"};
      int v = (int) id(brink_bypass_status_code).state;
      switch (v) { case 0: return {"Initialisierung"}; case 1: return {"Öffnet"}; case 2: return {"Schließt"}; case 3: return {"Geöffnet"}; case 4: return {"Geschlossen"}; default: return {"Code " + to_string(v)}; }

  - platform: template
    name: "Brink Vorheizer Status"
    update_interval: 10s
    lambda: |-
      if (isnan(id(brink_preheater_status_code).state)) return {"unbekannt"};
      int v = (int) id(brink_preheater_status_code).state;
      switch (v) { case 0: return {"Initialisierung"}; case 1: return {"Inaktiv"}; case 2: return {"Aktiv"}; case 3: return {"Testmodus"}; default: return {"Code " + to_string(v)}; }

  - platform: template
    name: "Brink Frostschutz Status"
    update_interval: 10s
    lambda: |-
      if (isnan(id(brink_frost_status_code).state)) return {"unbekannt"};
      int v = (int) id(brink_frost_status_code).state;
      switch (v) { case 0: return {"Nicht initialisiert"}; case 1: return {"Startverzögerung"}; case 2: return {"Kein Frost"}; case 3: return {"Kein Frost Verzögerung"}; case 4: return {"Frostschutz Startverzögerung"}; case 5: return {"Warten auf Vereisung"}; case 6: return {"Eis erkannt"}; case 7: return {"Heizen"}; case 8: return {"Warten auf freien Heizer"}; case 9: return {"Lüftersteuerung Startverzögerung"}; case 10: return {"Lüftersteuerung Wartezeit"}; case 11: return {"Lüftersteuerung"}; case 12: return {"Lüfter Aus Verzögerung"}; case 13: return {"Lüfter Aus"}; case 14: return {"Lüfter Neustart"}; case 15: return {"Fehler"}; case 16: return {"Testmodus"}; default: return {"Code " + to_string(v)}; }

  - platform: template
    name: "Brink Schalterposition"
    update_interval: 10s
    lambda: |-
      if (isnan(id(brink_flow_switch_position_code).state)) return {"unbekannt"};
      int v = (int) id(brink_flow_switch_position_code).state;
      switch (v) { case 0: return {"Urlaub"}; case 1: return {"Niedrig"}; case 2: return {"Normal"}; case 3: return {"Hoch"}; case 255: return {"Ungültige Position"}; default: return {"Code " + to_string(v)}; }

  - platform: template
    name: "Brink Filterstatus"
    update_interval: 10s
    lambda: |-
      if (isnan(id(brink_filter_status_code).state)) return {"unbekannt"};
      int v = (int) id(brink_filter_status_code).state;
      switch (v) { case 0: return {"Nicht verschmutzt"}; case 1: return {"Filter verschmutzt"}; default: return {"Code " + to_string(v)}; }
